[project]
name = "vouch"
version = "0.1.0"
description = "Event vendor payables specialist on Anthropic's finance team (simulated data)"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.3,<3", "pyyaml>=6"]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "vouch[ui]"]

[tool.setuptools.packages.find]
include = ["vouch*"]

[tool.setuptools.package-data]
vouch = ["world/*.yaml", "db/*.sql", "controls/*.sql", "agent/*.sql", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each run builds several worlds and databases; keep temp files only for failed tests of the latest run.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
