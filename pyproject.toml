[project]
name = "vouch"
version = "0.1.0"
description = "Autonomous payroll and stock-compensation accountant for Northlight Labs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["vouch*"]

[tool.setuptools.package-data]
vouch = ["reference/*", "calc/*.json", "db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
