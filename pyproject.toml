[project]
name = "vouch"
version = "0.1.0"
description = "Autonomous payroll and stock-compensation accountant for Northlight Labs"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["vouch*"]

[tool.setuptools.package-data]
vouch = ["reference/*", "calc/*.json", "db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each run builds several worlds and databases; keep temp files only for failed tests of the latest run.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
