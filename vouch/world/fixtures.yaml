periods: {rule: "month M closes on the 10th of M+1", first: 2026-01}

# Spec §4.4, seeded exactly. `value` is the rule's number (EUR amounts and rates as exact decimals).
rules:
  - {rule_id: R-BV-ALLOW, version: 1, valid_from: 2015-01-01, value: 110.00, text: "EUR 110.00 per employee per event, gross; excess taxable", basis: "§19(1) No. 1a EStG", source_url: "https://www.gesetze-im-internet.de/estg/__19.html", checked: not yet verified}
  - {rule_id: R-BV-MAX, version: 1, valid_from: 2015-01-01, value: 2, text: "2 qualifying events per employee per calendar year; employer chooses which", basis: "§19(1) No. 1a EStG", source_url: "https://www.gesetze-im-internet.de/estg/__19.html", checked: not yet verified}
  - {rule_id: R-BV-DEF, version: 1, valid_from: 2015-01-01, value: 0.50, text: "Social character; open to all staff of the company or an org unit; > 50% of attendees are employees + their companions", basis: "§19(1) No. 1a EStG", source_url: "https://www.gesetze-im-internet.de/estg/__19.html", checked: not yet verified}
  - {rule_id: R-BV-COST, version: 1, valid_from: 2015-01-01, text: "All costs incl. VAT (food, drinks, venue, program, transport, gifts handed out at the event); divided by actual attendees incl. companions; companion share attributed to host employee", basis: "§19(1) No. 1a EStG", source_url: "https://www.gesetze-im-internet.de/estg/__19.html", checked: not yet verified}
  - {rule_id: R-BV-FLAT, version: 1, valid_from: 2015-01-01, value: 0.25, text: "Taxable excess may be flat-taxed at 25% (+ surcharge + church tax)", basis: "§40(2) S.1 No. 2 EStG", source_url: "https://www.gesetze-im-internet.de/estg/__40.html", checked: not yet verified}
  - {rule_id: R-BV-VAT, version: 1, valid_from: 2015-01-01, value: 110.00, text: "Input VAT recoverable only if cost per participant (gross) <= EUR 110.00; otherwise no input VAT for the whole event (Freigrenze)", basis: "UStG §3(9a), §15; BFH V R 16/21", source_url: "https://www.gesetze-im-internet.de/ustg_1980/__15.html", checked: not yet verified}
  - {rule_id: R-BEW-70, version: 1, valid_from: 2004-01-01, value: 0.70, text: "Business hospitality: 70% of net deductible, 30% non-deductible", basis: "§4(5) No. 2 EStG", source_url: "https://www.gesetze-im-internet.de/estg/__4.html", checked: not yet verified}
  - {rule_id: R-BEW-DOC, version: 1, valid_from: 2004-01-01, value: 250.00, text: "Required: date, place, host, every participant's name, specific occasion; invoice > EUR 250 gross must name the host", basis: "§4(5) No. 2 EStG, R 4.10 EStR", source_url: "https://www.gesetze-im-internet.de/estg/__4.html", checked: not yet verified}
  - {rule_id: R-BEW-VAT, version: 1, valid_from: 2004-01-01, text: "Input VAT on documented, reasonable hospitality is fully recoverable", basis: "§15(1a) UStG", source_url: "https://www.gesetze-im-internet.de/ustg_1980/__15.html", checked: not yet verified}
  - {rule_id: R-GIFT-50, version: 1, valid_from: 2024-01-01, value: 50.00, text: "Gifts to a non-employee deductible only if that recipient's gifts in the year total <= EUR 50.00 (net if VAT recoverable, else gross); over -> all non-deductible, input VAT blocked", basis: "§4(5) No. 1 EStG; §15(1a) UStG", source_url: "https://www.gesetze-im-internet.de/estg/__4.html", checked: not yet verified}
  - {rule_id: R-GIFT-REC, version: 1, valid_from: 2004-01-01, text: "Gifts recorded separately with recipient name", basis: "§4(7) EStG", source_url: "https://www.gesetze-im-internet.de/estg/__4.html", checked: not yet verified}
  - {rule_id: R-GIFT-VER, version: 1, valid_from: 2004-01-01, valid_to: 2023-12-31, value: 35.00, text: "Limit EUR 35.00 for gifts before 2024-01-01", basis: "Wachstumschancengesetz", source_url: "https://www.gesetze-im-internet.de/estg/__4.html", checked: not yet verified}
  - {rule_id: R-GIFT-VER, version: 2, valid_from: 2024-01-01, value: 50.00, text: "Limit EUR 50.00 for gifts from 2024-01-01", basis: "Wachstumschancengesetz", source_url: "https://www.gesetze-im-internet.de/estg/__4.html", checked: not yet verified}
  - {rule_id: R-PROMO, version: 1, valid_from: 2004-01-01, value: 10.00, text: "Items <= EUR 10.00 net per unit: no recipient record, no §37b", basis: "BMF practice", source_url: "https://www.bundesfinanzministerium.de", checked: not yet verified}
  - {rule_id: R-37B-RATE, version: 1, valid_from: 2007-01-01, value: 0.30, text: "30% of gross value; + 5.5% surcharge on the tax; + church tax (TAX-KIST) on the tax", basis: "§37b EStG", source_url: "https://www.gesetze-im-internet.de/estg/__37b.html", checked: not yet verified}
  - {rule_id: R-37B-CAP, version: 1, valid_from: 2007-01-01, value: 10000.00, text: "Not available above EUR 10,000 per recipient per year (gross)", basis: "§37b(1) EStG", source_url: "https://www.gesetze-im-internet.de/estg/__37b.html", checked: not yet verified}
  - {rule_id: R-37B-UNI, version: 1, valid_from: 2007-01-01, text: "Election applies uniformly to all qualifying benefits of the year per group", basis: "§37b EStG", source_url: "https://www.gesetze-im-internet.de/estg/__37b.html", checked: not yet verified}
  - {rule_id: R-37B-DED, version: 1, valid_from: 2007-01-01, text: "Flat tax deductible only if the underlying benefit is deductible; flat tax not added to the EUR 50 test", basis: "BMF practice (BFH IV R 13/14 stricter; policy POL-37B-01 follows BMF)", source_url: "https://www.bundesfinanzministerium.de", checked: not yet verified}
  - {rule_id: R-37B-NOTE, version: 1, valid_from: 2007-01-01, text: "Recipient must be notified", basis: "§37b(3) EStG", source_url: "https://www.gesetze-im-internet.de/estg/__37b.html", checked: not yet verified}
  - {rule_id: R-AE-60, version: 1, valid_from: 2015-01-01, value: 60.00, text: "Working meal <= EUR 60.00 gross per person during an exceptional assignment: not pay, 100% deductible; above -> full value is pay", basis: "R 19.6(2) LStR", source_url: "https://www.bundesfinanzministerium.de", checked: not yet verified}
  - {rule_id: R-VAT-FIX, version: 1, valid_from: 2004-01-01, text: "VAT corrections when an earlier reclaim becomes blocked are booked in the current open period", basis: "§17(2) No. 5 UStG", source_url: "https://www.gesetze-im-internet.de/ustg_1980/__17.html", checked: not yet verified}
  - {rule_id: TAX-SOLI, version: 1, valid_from: 1995-01-01, value: 0.055, text: "Solidarity surcharge 5.5% on the tax", basis: "SolZG", source_url: "https://www.gesetze-im-internet.de/solzg_1995/__4.html", checked: not yet verified}
  - {rule_id: TAX-KIST, version: 1, valid_from: 2026-01-01, value: 0.07, text: "Church tax 7% on the tax (simulated: Bavarian simplified rate; verify)", basis: "Church tax law", source_url: "https://www.gesetze-bayern.de", checked: not yet verified}
  - {rule_id: TAX-VAT, version: 1, valid_from: 2007-01-01, value: 0.19, text: "0.19 standard; never assumed, read from invoice; arithmetic validated", basis: "UStG", source_url: "https://www.gesetze-im-internet.de/ustg_1980/__12.html", checked: not yet verified}
policies:   # company tax policies, simulated, owned by the tax manager
  - {id: POL-BV-OPT, owner: P-TAX, text: "Allowance per employee goes to the 2 events that maximize the exempt amount (min(attributed, 110)); ties -> earlier event. Re-evaluated whenever a new event is added; changes produce payroll corrections in the current period."}
  - {id: POL-BV-VATBASIS, owner: P-TAX, text: "VAT test uses cost per participant (incl. companions), not per employee."}
  - {id: POL-BV-FLAT, owner: P-TAX, text: "Taxable excess on qualifying staff events is always flat-taxed (§40). Non-qualifying events (e.g. not open to all): escalate whether flat tax may be used."}
  - {id: POL-BEW-02, owner: P-TAX, text: "At customer events: catering and venue = hospitality (70%); entertainment program = non-gift benefit, 100% deductible, input VAT recoverable, §37b applies to the business partners' pro-rata share (by headcount)."}
  - {id: POL-LUMP, owner: P-TAX, text: "A package line that mixes categories must be itemized by the vendor before classification; if the vendor refuses, escalate (no guessed split)."}
  - {id: POL-37B-01, owner: P-TAX, text: "§37b flat tax not counted toward the EUR 50 test (BMF practice); flat tax follows deductibility of the gift."}
  - {id: POL-ROUND, owner: P-TAX, text: "Per-participant cost kept at full precision; attributed amount per employee = round(per_participant x (1 + companions)); flat taxes computed per run on the summed base: tax = round(base x rate), surcharge = round(tax x 0.055), church = round(tax x 0.07)."}
  - {id: POL-MAT, owner: P-TAX, text: "Routing thresholds in spec §5.9: policy approval only with no non-info flags, no taxable pay, no corrections, non-deductible < EUR 1,000 and §37b < EUR 1,000; else the tax manager; correction entries >= EUR 5,000 add the controller."}
