# Base company fixtures: VOUCH_DE_EVENT_TAX_SPEC.md Appendix A, seeded exactly, plus the rules and
# company tax policies of spec §4.4. The company, people, events and amounts are simulated; the rules are
# real German tax law. Rule source links are given as the spec names them and are labelled
# `checked: not yet verified` until a person checks each against the official text.
# Fields this file adds to Appendix A: rules/policies rows (from §4.4) and as_of (the date the base company
# is built at when no scenario names one).
