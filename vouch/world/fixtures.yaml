  - {clause_id: CAT-GUARANTEE, contract: C-GFORK-SF26, type: guarantee, params: {guaranteed_count: 300, final_count_due: 2026-06-08, billed_count: "max(guarantee, verified_served) capped at invoiced count"}, text: "Client guarantees 300 meals; the final count is due 8 June. Billed count is the greater of the guarantee and the verified count served, never more than invoiced."}
  - {clause_id: CAT-STAFF,     contract: C-GFORK-SF26, type: staff_count, params: {counts_toward_headcount: false}, text: "Staff meals do not count toward the headcount."}
